<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malla de Física</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="0.9em" font-size="90">💌</text></svg>'></head>
<body>
  <h1>Malla Curricular - Física UNT</h1>
  <div class="selector-tema">
  <span>Tema:</span>
  <button type="button" class="btn-tema activo" data-tema="rosa">Rosa</button>
  <button type="button" class="btn-tema" data-tema="amarillo">Amarillo</button>
  <button type="button" class="btn-tema" data-tema="verde">Verde</button>
  <button type="button" class="btn-tema" data-tema="celeste">Celeste</button>
  <button type="button" class="btn-tema" data-tema="rojo">Rojo</button>
</div>
  <div class="scroll-hint">✨ Desliza horizontalmente para ver todos los ciclos ✨</div>
  <div id="malla">
    <div class="tabla-ciclos" id="tablaCiclos"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
